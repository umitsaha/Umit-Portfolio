<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Umit Saha — Software Engineer at Samsung R&D Bangladesh. Competitive programmer (Codeforces Expert), ICPC Asia West 2025 participant, and IEEE-published researcher."
    />
    <meta name="author" content="Umit Saha" />
    <meta name="theme-color" content="#07090f" />
    <meta property="og:title" content="Umit Saha | Software Engineer" />
    <meta
      property="og:description"
      content="Portfolio of Umit Saha: software engineering, competitive programming, and research."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <title>Umit Saha | Software Engineer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          var theme = stored === 'light' || stored === 'dark' ? stored : 'dark'
          document.documentElement.classList.remove('light', 'dark')
          document.documentElement.classList.add(theme)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
